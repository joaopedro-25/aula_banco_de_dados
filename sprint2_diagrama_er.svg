<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <marker id="crowOne" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2,2 L10,7 L2,12" fill="none" stroke="#7fd3c7" stroke-width="1.5"/>
    </marker>
    <marker id="crowMany" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto">
      <path d="M2,2 L16,9 L2,16 M2,9 L16,9" fill="none" stroke="#7fd3c7" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#0b1220"/>
  <text x="700" y="45" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="bold">Modelo Conceitual — Loja Online (Sprint 2)</text>

  <!-- CATEGORIA -->
  <g>
    <rect x="60" y="100" width="260" height="150" rx="6" fill="#0f2733" stroke="#2fbfa8" stroke-width="1.5"/>
    <rect x="60" y="100" width="260" height="34" rx="6" fill="#2fbfa8"/>
    <text x="190" y="123" text-anchor="middle" fill="#04241d" font-size="15" font-weight="bold">CATEGORIA</text>
    <text x="75" y="158" fill="#f7c948" font-size="13">PK id_categoria</text>
    <text x="75" y="180" fill="#dbe7e5" font-size="13">nome</text>
    <text x="75" y="202" fill="#dbe7e5" font-size="13">descricao</text>
  </g>

  <!-- PRODUTO -->
  <g>
    <rect x="440" y="80" width="280" height="190" rx="6" fill="#0f2733" stroke="#2fbfa8" stroke-width="1.5"/>
    <rect x="440" y="80" width="280" height="34" rx="6" fill="#2fbfa8"/>
    <text x="580" y="103" text-anchor="middle" fill="#04241d" font-size="15" font-weight="bold">PRODUTO</text>
    <text x="455" y="138" fill="#f7c948" font-size="13">PK id_produto</text>
    <text x="455" y="160" fill="#dbe7e5" font-size="13">nome</text>
    <text x="455" y="182" fill="#dbe7e5" font-size="13">descricao</text>
    <text x="455" y="204" fill="#dbe7e5" font-size="13">preco</text>
    <text x="455" y="226" fill="#dbe7e5" font-size="13">estoque</text>
    <text x="455" y="248" fill="#9fd0ff" font-size="13">FK id_categoria</text>
  </g>

  <!-- CLIENTE -->
  <g>
    <rect x="1080" y="80" width="260" height="190" rx="6" fill="#0f2733" stroke="#2fbfa8" stroke-width="1.5"/>
    <rect x="1080" y="80" width="260" height="34" rx="6" fill="#2fbfa8"/>
    <text x="1210" y="103" text-anchor="middle" fill="#04241d" font-size="15" font-weight="bold">CLIENTE</text>
    <text x="1095" y="138" fill="#f7c948" font-size="13">PK id_cliente</text>
    <text x="1095" y="160" fill="#dbe7e5" font-size="13">nome</text>
    <text x="1095" y="182" fill="#dbe7e5" font-size="13">email</text>
    <text x="1095" y="204" fill="#dbe7e5" font-size="13">telefone</text>
    <text x="1095" y="226" fill="#dbe7e5" font-size="13">endereco</text>
  </g>

  <!-- PEDIDO -->
  <g>
    <rect x="1000" y="380" width="280" height="170" rx="6" fill="#0f2733" stroke="#2fbfa8" stroke-width="1.5"/>
    <rect x="1000" y="380" width="280" height="34" rx="6" fill="#2fbfa8"/>
    <text x="1140" y="403" text-anchor="middle" fill="#04241d" font-size="15" font-weight="bold">PEDIDO</text>
    <text x="1015" y="438" fill="#f7c948" font-size="13">PK id_pedido</text>
    <text x="1015" y="460" fill="#dbe7e5" font-size="13">data_pedido</text>
    <text x="1015" y="482" fill="#dbe7e5" font-size="13">status</text>
    <text x="1015" y="504" fill="#9fd0ff" font-size="13">FK id_cliente</text>
  </g>

  <!-- ITEM_PEDIDO -->
  <g>
    <rect x="500" y="420" width="320" height="210" rx="6" fill="#0f2733" stroke="#2fbfa8" stroke-width="1.5"/>
    <rect x="500" y="420" width="320" height="34" rx="6" fill="#2fbfa8"/>
    <text x="660" y="443" text-anchor="middle" fill="#04241d" font-size="15" font-weight="bold">ITEM_PEDIDO</text>
    <text x="515" y="478" fill="#f7c948" font-size="13">PK id_item</text>
    <text x="515" y="500" fill="#9fd0ff" font-size="13">FK id_pedido</text>
    <text x="515" y="522" fill="#9fd0ff" font-size="13">FK id_produto</text>
    <text x="515" y="544" fill="#dbe7e5" font-size="13">quantidade</text>
    <text x="515" y="566" fill="#dbe7e5" font-size="13">preco_unitario</text>
  </g>

  <!-- Relationships -->
  <!-- Categoria 1:N Produto -->
  <line x1="320" y1="175" x2="440" y2="175" stroke="#7fd3c7" stroke-width="1.5" marker-start="url(#crowOne)" marker-end="url(#crowMany)"/>
  <text x="380" y="165" text-anchor="middle" fill="#9fb3ad" font-size="12">possui</text>

  <!-- Produto 1:N Item_Pedido -->
  <path d="M600,270 L600,420" fill="none" stroke="#7fd3c7" stroke-width="1.5" marker-start="url(#crowOne)" marker-end="url(#crowMany)"/>
  <text x="615" y="350" fill="#9fb3ad" font-size="12">é vendido em</text>

  <!-- Cliente 1:N Pedido -->
  <path d="M1210,270 L1210,340 L1140,340 L1140,380" fill="none" stroke="#7fd3c7" stroke-width="1.5" marker-start="url(#crowOne)" marker-end="url(#crowMany)"/>
  <text x="1220" y="330" fill="#9fb3ad" font-size="12">realiza</text>

  <!-- Pedido 1:N Item_Pedido -->
  <line x1="1000" y1="500" x2="820" y2="500" stroke="#7fd3c7" stroke-width="1.5" marker-start="url(#crowOne)" marker-end="url(#crowMany)"/>
  <text x="910" y="490" text-anchor="middle" fill="#9fb3ad" font-size="12">contém</text>

  <!-- Legend -->
  <g>
    <rect x="60" y="740" width="640" height="120" rx="6" fill="#0f1a26" stroke="#33475a" stroke-width="1"/>
    <text x="80" y="768" fill="#ffffff" font-size="14" font-weight="bold">Legenda</text>
    <text x="80" y="792" fill="#f7c948" font-size="13">PK</text>
    <text x="115" y="792" fill="#dbe7e5" font-size="13">= Chave Primária</text>
    <text x="80" y="814" fill="#9fd0ff" font-size="13">FK</text>
    <text x="115" y="814" fill="#dbe7e5" font-size="13">= Chave Estrangeira</text>
    <text x="80" y="836" fill="#7fd3c7" font-size="13">──&lt;   = Relacionamento 1:N (um para muitos)</text>
  </g>
</svg>
